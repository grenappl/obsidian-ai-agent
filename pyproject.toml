[project]
name = "obsidian-ai-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "grenappl", email = "greencolorapple@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "asttokens>=3.0.2",
    "comm>=0.2.3",
    "langchain>=1.4.3",
    "langchain-google-genai>=4.4.0",
    "langchain-openrouter>=0.2.9",
    "langgraph>=1.2.13",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.4",
]

[project.scripts]
obsidian-ai-agent = "obsidian_ai_agent.main:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]
